apiVersion: apps/v1
kind: Deployment
metadata: {name: rpa2apa-api}
spec:
  replicas: 2
  selector: {matchLabels: {app: rpa2apa-api}}
  template:
    metadata: {labels: {app: rpa2apa-api}}
    spec:
      containers:
        - name: api
          image: rpa2apa/api:latest
          ports: [{containerPort: 8080}]
          env:
            - name: RPA2APA_REQUIRE_REVIEW
              value: "true"
          readinessProbe: {httpGet: {path: /health, port: 8080}, initialDelaySeconds: 3, periodSeconds: 10}
---
apiVersion: v1
kind: Service
metadata: {name: rpa2apa-api}
spec:
  selector: {app: rpa2apa-api}
  ports: [{port: 8080, targetPort: 8080}]
