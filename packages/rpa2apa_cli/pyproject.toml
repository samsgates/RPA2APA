[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rpa2apa"
version = "0.1.0"
description = "RPA2APA CLI"
requires-python = ">=3.11"
dependencies = ["typer>=0.12,<1", "rich>=13,<15", "PyYAML>=6,<7", "pydantic>=2,<3"]

[project.scripts]
rpa2apa = "rpa2apa_cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/rpa2apa_cli"]
