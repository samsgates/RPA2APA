services:
  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    environment:
      RPA2APA_DATABASE_URL: postgresql+psycopg://rpa2apa:rpa2apa@postgres:5432/rpa2apa
      RPA2APA_REDIS_URL: redis://redis:6379/0
      RPA2APA_REQUIRE_REVIEW: "true"
      RPA2APA_MODEL_PROVIDER: mock
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
    ports:
      - "3000:3000"
    depends_on:
      - api

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: rpa2apa
      POSTGRES_USER: rpa2apa
      POSTGRES_PASSWORD: rpa2apa
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rpa2apa"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine

volumes:
  pgdata:
