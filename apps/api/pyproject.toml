[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rpa2apa-api"
version = "0.1.0"
description = "RPA2APA control plane and migration engine"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.141.1,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "python-multipart>=0.0.9,<1",
  "PyYAML>=6.0,<7",
  "httpx>=0.27,<1",
  "networkx>=3.3,<4",
  "tenacity>=9,<10",
  "typer>=0.12,<1"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.6,<1"
]

[tool.hatch.build.targets.wheel]
packages = ["src/rpa2apa_api"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
